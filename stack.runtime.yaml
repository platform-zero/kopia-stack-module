---
schemaVersion: 1
module: "kopia"
target: "apps"
services:
  kopia:
    image: "kopia/kopia:0.22.3"
    containerName: "kopia"
    lifecycle: "daemon"
    updatePolicy: "registry"
    placement: "rootful"
    dependencies:
      caddy: "started"
    environment:
      KOPIA_REPO_PATH: "/app/repository"
      KOPIA_PASSWORD: "${KOPIA_PASSWORD}"
      KOPIA_SERVER_USERNAME: "${KOPIA_SERVER_USERNAME:-kopia}"
      KOPIA_SERVER_PASSWORD: "${KOPIA_PASSWORD}"
      USER: "kopia"
    networks:
      caddy: null
      internet: null
    volumes:
    - "kopia_data:/app"
    - "postgres_data:/backup/postgres:ro"
    - "mariadb_data:/backup/mariadb:ro"
    - "./configs/kopia/init-kopia.sh:/init-kopia.sh:ro"
    health:
      test:
      - "CMD-SHELL"
      - |
        printf 'header = "Authorization: Basic %s"\n' \
          "$$(printf '%s:%s' "$${KOPIA_SERVER_USERNAME:-kopia}" "$${KOPIA_SERVER_PASSWORD:-$${KOPIA_PASSWORD}}" | base64 -w0)" \
          | curl -fsS --config - http://localhost:51515/ >/dev/null
      interval: "60s"
      timeout: "10s"
      retries: 3
      start_period: "30s"
    entrypoint:
    - "sh"
    - "/init-kopia.sh"
    restart: "unless-stopped"
networks: {}
volumes: {}
